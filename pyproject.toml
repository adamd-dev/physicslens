[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Flat layout: only ship the library, not tests/ or samples/.
include = ["physicslens*"]

[project]
name = "physicslens"
version = "0.1.0"
description = "Measure real physics experiments from a phone video with Meta's models."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    # 4.10.0.84 is the last release with a macOS 12 x86_64 wheel; newer ones build from source (1h+).
    "opencv-python-headless>=4.9,<4.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
ui = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9"]
# Linters pinned: a new ruff or mypy release can add rules and fail CI on unchanged code.
dev = ["pytest>=8", "httpx>=0.27", "ruff==0.17.3", "mypy==1.20.2"]

[project.scripts]
physicslens-ui = "physicslens.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
# Pydantic models get their real __init__ signature (field defaults are optional arguments).
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# scipy ships no type stubs; scipy-stubs is not worth a dependency for one curve_fit call.
module = ["scipy.*"]
ignore_missing_imports = true
