name: tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      # ui: the API tests import FastAPI.
      - run: pip install -e ".[ui,dev]"
      - run: ruff check .
      - run: mypy physicslens cli.py
      # Tests are synthetic and offline: no API keys or sample videos needed.
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # tsc --noEmit, then vite build.
      - run: npm run build
